name: KINT10dAcademy
options:
  bundleIdPrefix: org.kint10d
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  AcademyCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 2
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: KINT10d Academy
    CODE_SIGN_STYLE: Automatic
targets:
  AcademyMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AcademyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kint10d.academy.mac
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: AcademyMac.entitlements
        ENABLE_APP_SANDBOX: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
  AcademyiOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: AcademyCore
      - target: MikoWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kint10d.academy.mobile
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [academy]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  MikoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MikoWidget
      - path: Shared
      - path: Resources/MikoAtlas.png
        buildPhase: resources
    info:
      path: Generated/MikoWidget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kint10d.academy.mobile.miko
        INFOPLIST_KEY_CFBundleDisplayName: Miko
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  AcademyMac:
    build:
      targets:
        AcademyMac: all
  AcademyiOS:
    build:
      targets:
        AcademyiOS: all
